<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>Healthy Lifestyle Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* BACKGROUND */
      --bg-primary: #1a1832;
      --bg-secondary: #1e1b3a;

      /* CARD */
      --card-bg: #242248;
      --card-soft: #1e1b3a;
      --card-border: rgba(255, 255, 255, 0.1);

      /* PRIMARY */
      --primary: #20B486;
      --primary-hover: #1AA376;
      --primary-active: #5eead4;
      --primary-light: rgba(32, 180, 134, 0.18);

      /* SECONDARY */
      --secondary: #818cf8;
      --secondary-hover: #6366f1;
      --secondary-light: rgba(129, 140, 248, 0.15);

      /* ACCENT */
      --accent: #fb923c;
      --accent-hover: #f97316;
      --accent-light: rgba(251, 146, 60, 0.15);

      /* TEXT */
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.82);
      --text-muted: rgba(255, 255, 255, 0.45);
      --text-inverse: #0F172A;

      /* STATUS */
      --success: #4ade80;
      --warning: #fbbf24;
      --error: #f87171;
      --info: #38bdf8;

      /* TAG */
      --tag-bg: rgba(32, 180, 134, 0.2);
      --tag-text: #34d399;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-primary);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1b3a;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Reading passage thin scrollbar */
    .reading-passage-container::-webkit-scrollbar {
      width: 4px;
    }

    .reading-passage-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .reading-passage-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
